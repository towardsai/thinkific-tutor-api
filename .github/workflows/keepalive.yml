name: HF Space Keepalive

on:
  workflow_dispatch:
  schedule:
    # Keep the free cpu-basic Space warm well before HF's inactivity window.
    - cron: "17 */12 * * *"

env:
  SPACE_BASE_URL: https://towardsai-tutors-thinkific-tutor-api.hf.space

jobs:
  ping:
    name: Ping HF Space
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Health check
        run: |
          curl --fail --show-error --silent --max-time 180 "$SPACE_BASE_URL/healthz"

      - name: Sales helper catalog freshness
        run: |
          curl --fail --show-error --silent --max-time 60 \
            "$SPACE_BASE_URL/api/helper/healthz" -o helper-health.json
          cat helper-health.json
          jq -e '.catalog.fresh == true and .catalog.evidencePages > 0 and .catalog.expiresInDays >= 5' \
            helper-health.json

      - name: Widget check
        run: |
          curl --fail --show-error --silent --max-time 60 "$SPACE_BASE_URL/widget.js" -o tutor-widget.js
          grep -q "Towards AI Tutor" tutor-widget.js

      - name: Helper widget check
        run: |
          curl --fail --show-error --silent --max-time 60 "$SPACE_BASE_URL/helper-widget.js" -o helper-widget.js
          grep -q "Towards AI Helper" helper-widget.js
