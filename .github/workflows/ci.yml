name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_chat:
        description: "Run the live /chat smoke test against the deployed Space"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_all_course_chat:
        description: "Run the live /chat smoke test once per course"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "23 */6 * * *"

jobs:
  fast-tests:
    name: Fast Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AI_TUTOR_APP_PATH: ${{ github.workspace }}/ai-tutor-app

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v7.0.1

      - name: Checkout ai-tutor-app dependency
        uses: actions/checkout@v7.0.1
        with:
          repository: towardsai/ai-tutor-app
          ref: c8c398a75e76154cb6e7140a169f684ece5f6ac7
          path: ai-tutor-app

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Ruff
        run: uv run --locked ruff check thinkific_tutor tests

      - name: Widget syntax
        run: |
          node --check static/thinkific-widget.js
          node --check static/helper-widget.js

      - name: Pytest
        run: uv run --locked pytest -m "not live" -p no:cacheprovider tests

  live-smoke:
    name: Live HF Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    env:
      LIVE_SPACE_BASE_URL: ${{ vars.LIVE_SPACE_BASE_URL || 'https://towardsai-tutors-thinkific-tutor-api.hf.space' }}
      RUN_LIVE_CHAT_SMOKE: ${{ github.event.inputs.run_live_chat || 'false' }}
      RUN_LIVE_ALL_COURSE_CHAT: ${{ github.event.inputs.run_all_course_chat || 'false' }}
      LIVE_SMOKE_STUDENT_ID: github-action-smoke

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Live smoke tests
        run: uv run --locked pytest -m live -p no:cacheprovider tests/test_live_smoke.py
